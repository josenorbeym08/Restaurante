<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital | Pedidos por WhatsApp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <h1 class="brand">🚀 Gourmet<span>Express</span></h1>
            <div class="cart-trigger" id="openCart">
                <i class="fas fa-shopping-basket"></i>
                <span class="badge" id="cartCount">0</span>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="categories-nav" id="categoryTabs">
            <button class="tab-btn active" data-cat="entradas">Entradas</button>
            <button class="tab-btn" data-cat="platos">Fuertes</button>
            <button class="tab-btn" data-cat="postres">Postres</button>
            <button class="tab-btn" data-cat="bebidas">Bebidas</button>
        </nav>

        <section id="menuDisplay" class="menu-grid">
            </section>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="cart-modal">
            <div class="modal-header">
                <h3>Resumen de Pedido</h3>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div class="modal-body" id="cartItems">
                </div>
            <div class="modal-footer">
                <div class="total-row">
                    <span>Total a pagar:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn-send" id="btnSend">
                    <i class="fab fa-whatsapp"></i> Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
